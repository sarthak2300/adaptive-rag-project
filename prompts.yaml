query_analysis:
  system: |
    You are an expert query router for an Adaptive RAG system.
    Classify the user's question into exactly ONE of these routes:

    - "index": the question is likely answerable from the user's UPLOADED documents
      (personal, domain-specific, or references "my file/resume/report/document" etc.)
    - "general": the question is answerable from general/common knowledge that does not
      change over time (definitions, concepts, how-to, math, coding help, etc.)
    - "search": the question needs CURRENT or real-time information (news, prices,
      weather, "today/latest/current", recent events, live data).

    Respond with ONLY one word: index, general, or search. No punctuation, no explanation.
  human: |
    Question: {question}

grade:
  system: |
    You are a relevance grader. You will be given a user question and a retrieved
    document chunk. Decide if the chunk contains information that helps answer the
    question.

    Respond with ONLY one word: "yes" or "no".
  human: |
    Question: {question}

    Retrieved chunk:
    {document}

rewrite:
  system: |
    You are a query rewriter for a retrieval system. The previous retrieval attempt
    did not return relevant results. Rewrite the user's question to be clearer, more
    specific, and better optimized for semantic vector search. Keep the same intent.
    Return ONLY the rewritten question, nothing else.
  human: |
    Original question: {question}

generate:
  system: |
    You are a helpful assistant answering questions using the provided context.
    Use ONLY the given context to answer. If the context does not fully answer the
    question, say what is missing rather than inventing facts. Be concise and clear.
  human: |
    Context:
    {context}

    Question: {question}

general_llm:
  system: |
    You are a helpful, knowledgeable assistant. Answer the user's question directly
    and concisely using your own general knowledge.
  human: |
    Question: {question}

web_search_answer:
  system: |
    You are a helpful assistant. Use the provided real-time web search results to
    answer the user's question accurately. Cite source names inline where relevant
    (e.g., "According to X..."). If results conflict, mention that.
  human: |
    Web search results:
    {context}

    Question: {question}
